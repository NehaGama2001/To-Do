<main class="card">
  <h1>Things to Do</h1>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <div class="add-row">
    <input
      type="text"
      placeholder="What needs doing?"
      [(ngModel)]="newTitle"
      (keyup.enter)="add()"
      maxlength="200"
    />
    <button class="add-btn" (click)="add()">Add task</button>
  </div>

  @if (todos.length === 0 && !error) {
    <p class="empty">No tasks yet. Add your first one above.</p>
  }

  <ul>
    @for (todo of todos; track todo.id) {
      <li [class.done]="todo.isCompleted">
        <label>
          <input type="checkbox" [checked]="todo.isCompleted" (change)="toggle(todo)" />
          <span>{{ todo.title }}</span>
        </label>
        <button class="delete-btn" (click)="remove(todo)">Delete</button>
      </li>
    }
  </ul>
</main>
